<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AIcut</title></head>
<body>
<div id="root"></div>
<script>
// Browser API mock — falls back when not in Electron
if (!window.aicut) {
  const API = 'http://localhost:3456';
  window.aicut = {
    render: (json) => fetch(API+'/api/render',{method:'POST',body:json}).then(r=>r.json()),
    probe: (path) => fetch(API+'/api/probe',{method:'POST',body:JSON.stringify({path})}).then(r=>r.json()),
    getPresets: () => fetch(API+'/api/presets').then(r=>r.json()),
    getVersion: () => fetch(API+'/api/version').then(r=>r.json().then(j=>j.version)),
    validate: (json) => fetch(API+'/api/render',{method:'POST',body:json}).then(r=>r.json().then(j=>({valid:j.success,errors:j.error?[j.error]:[]}))),
    openFiles: () => Promise.resolve([]),
    saveProject: (path,content) => Promise.resolve(true),
    loadProject: (path) => Promise.resolve('{}'),
  };
}
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
