[package]
name = "aicut-engine"
version = "0.1.0"
edition = "2021"
description = "AIcut video editing engine core (Rust)"
license = "MIT"
authors = ["AIcut Team"]
repository = "https://github.com/aicut/aicut"
keywords = ["video", "editing", "ffmpeg", "napi"]
categories = ["multimedia::video"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aicut-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

# ===== N-API 绑定（网络可用时取消注释并 cargo build --features napi）=====
# [features]
# napi = ["dep:napi", "dep:napi-derive"]
# napi = { version = "2", default-features = false, features = ["napi4"], optional = true }
# napi-derive = { version = "2", optional = true }
# [build-dependencies]
# napi-build = "2"


[profile.release]
lto = true
codegen-units = 1
opt-level = 3
